# The smallest working deployment: only what youtube-helper needs to run.
# compose.yaml next to this file explains every setting and adds log rotation.

services:
  youtube-helper:
    image: ghcr.io/mflorianw/youtube-helper:latest
    restart: unless-stopped
    user: "1000:1000"
    environment:
      MEDIA_LIBRARY: /media-library
      TZ: Europe/Berlin
    volumes:
      - /srv/media/youtube:/media-library
      - ./state:/state
    secrets:
      - google_client_id
      - google_client_secret

secrets:
  google_client_id:
    file: ./secrets/google_client_id
  google_client_secret:
    file: ./secrets/google_client_secret
