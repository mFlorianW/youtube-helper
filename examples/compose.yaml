# Example deployment of youtube-helper as its own compose project.
#
# Copy this file into an empty directory (e.g. /srv/youtube-helper/compose.yaml) and adjust
# the values marked "adjust". All configuration lives here; there is no separate config file.
#
# Before the first start, create the host directories for the Media library and the state,
# writable by the user below (the tool never changes ownership or permissions), and the
# secret for the SMTP password (see `secrets:` at the bottom).
# After the first start, open the web UI (see `ports:`) and add the channels to follow.

name: youtube-helper

services:
  youtube-helper:
    image: ghcr.io/mflorianw/youtube-helper:latest
    # Come back after crashes and host reboots, but stay down after `docker compose stop`.
    restart: unless-stopped
    # adjust: UID:GID that owns the Media library and the state directory on the host
    # (`id -u`, `id -g`). Files the tool writes belong to this user.
    user: "1000:1000"
    environment:
      # Where the Media library is mounted inside the container (must match `volumes:`).
      # Required: the daemon refuses to start without it.
      MEDIA_LIBRARY: /media-library
      # adjust: your local time zone (IANA name). Used for log times and for the release
      # time in filenames. Defaults to UTC; an unknown name stops the daemon.
      TZ: Europe/Berlin
      # Where the SQLite state lives inside the container. /state is the default, so this
      # line is optional; it is shown only to explain the `/state` mount below.
      STATE_DIR: /state
      # The port of the web UI inside the container (must match `ports:`). 8080 is the
      # default, so this line is optional.
      WEB_PORT: "8080"
      # The secret the SMTP password for email Notifications is encrypted with in the state
      # database (see `secrets:` below). Optional: without it, email works only with servers
      # that need no login. Set but unreadable, it stops the daemon.
      SECRET_KEY_FILE: /run/secrets/secret_key
    secrets:
      - secret_key
    # adjust: the host port of the web UI, e.g. http://<host>:8080. It has no login of its
    # own: keep it inside your LAN, or put a reverse proxy with authentication in front.
    ports:
      - "8080:8080"
    volumes:
      # adjust: host path of the Media library. Point your media server at the same path.
      # It is checked for writability at startup and before every cycle; while it isn't
      # writable, the daemon skips the cycles and the web UI names the directory.
      - /srv/media/youtube:/media-library:rw
      # adjust: host path for the state database (youtube-helper.sqlite3). Back it up;
      # losing it loses the Subscriptions.
      - /srv/youtube-helper/state:/state:rw
    # Logs go to stdout; rotate them so `docker logs` can't fill the disk.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

secrets:
  secret_key:
    # adjust: host path of the secret. Create it once and keep it; with a new one, the SMTP
    # password has to be entered again in the web UI. Readable only by the user above:
    #   openssl rand -base64 32 > /srv/youtube-helper/secret_key
    #   chown 1000:1000 /srv/youtube-helper/secret_key && chmod 400 /srv/youtube-helper/secret_key
    file: /srv/youtube-helper/secret_key
