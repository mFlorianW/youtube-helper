# Example deployment of youtube-helper as a Docker Swarm stack, for keeping the Google
# OAuth client ID and secret in Swarm's encrypted secret store instead of host files.
# Without Swarm, use compose.yaml next to this file; settings not explained here are
# explained there.
#
# Swarm stores secrets encrypted in its Raft log and only hands them to the containers
# that use them. youtube-helper reads them from /run/secrets/<name> either way, so the
# image is the same for both deployments.
#
# One-time setup on the (single-node) swarm:
#   docker swarm init
#   printf '%s' '<client id>' | docker secret create google_client_id -
#   printf '%s' '<client secret>' | docker secret create google_client_secret -
# Deploy and follow the logs:
#   docker stack deploy -c stack.yaml youtube-helper
#   docker service logs -f youtube-helper_youtube-helper
#
# A Swarm secret can't be changed in place. To replace one, remove the stack (or the
# secret from the service), `docker secret rm` it, create it again and redeploy.

services:
  youtube-helper:
    image: ghcr.io/mflorianw/youtube-helper:latest
    # adjust: UID:GID that owns the Media library and state directories on the host.
    user: "1000:1000"
    environment:
      MEDIA_LIBRARY: /media-library
      # adjust: your local time zone (IANA name).
      TZ: Europe/Berlin
    # Bind mounts refer to directories on the node running the task. They must already
    # exist there, which is why the service is pinned to the manager node below.
    volumes:
      # adjust: host path of the Media library.
      - type: bind
        source: /srv/media/youtube
        target: /media-library
      # adjust: host path for the state database.
      - type: bind
        source: /srv/youtube-helper/state
        target: /state
    # Long syntax: unlike plain Compose, Swarm sets owner and mode of the secret file in
    # the container, so the host needs no secret files at all.
    secrets:
      - source: google_client_id
        target: google_client_id
        uid: "1000"
        gid: "1000"
        mode: 0400
      - source: google_client_secret
        target: google_client_secret
        uid: "1000"
        gid: "1000"
        mode: 0400
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Swarm ignores `restart:`; this is its equivalent of `restart: unless-stopped`.
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 1m
      placement:
        constraints:
          - node.role == manager

# Created beforehand with `docker secret create` (see above).
secrets:
  google_client_id:
    external: true
  google_client_secret:
    external: true
