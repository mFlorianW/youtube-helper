# Example deployment of youtube-helper as a Docker Swarm stack, for hosts that run a swarm
# anyway. Without Swarm, use compose.yaml next to this file; settings not explained here are
# explained there.
#
# Deploy and follow the logs:
#   docker stack deploy -c stack.yaml youtube-helper
#   docker service logs -f youtube-helper_youtube-helper
# Then open the web UI (see `ports:`) and add the channels to follow.

services:
  youtube-helper:
    image: ghcr.io/mflorianw/youtube-helper:latest
    # adjust: UID:GID that owns the Media library and state directories on the host.
    user: "1000:1000"
    environment:
      MEDIA_LIBRARY: /media-library
      # adjust: your local time zone (IANA name).
      TZ: Europe/Berlin
    # adjust: the host port of the web UI. It has no login of its own: keep it inside your
    # LAN, or put a reverse proxy with authentication in front.
    ports:
      - target: 8080
        published: 8080
    # Bind mounts refer to directories on the node running the task. They must already
    # exist there, which is why the service is pinned to the manager node below.
    volumes:
      # adjust: host path of the Media library.
      - type: bind
        source: /srv/media/youtube
        target: /media-library
      # adjust: host path for the state database.
      - type: bind
        source: /srv/youtube-helper/state
        target: /state
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Swarm ignores `restart:`; this is its equivalent of `restart: unless-stopped`.
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 1m
      placement:
        constraints:
          - node.role == manager
