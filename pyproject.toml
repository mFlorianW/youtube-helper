[project]
name = "youtube-helper"
version = "0.1.0"
description = "Keeps a media library stocked with New uploads from the owner's YouTube Subscriptions"
authors = [
    { name = "Florian Weßel", email = "florianwessel@gmx.net" }
]
license = "GPL-2.0-only"
requires-python = ">=3.14"
dependencies = [
    "tzdata>=2026.5",
]

[project.scripts]
youtube-helper = "youtube_helper.daemon:cli"

[build-system]
requires = ["uv_build>=0.9.22,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "PT", "PTH"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]
