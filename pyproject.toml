[project]
name = "youtube-helper"
version = "0.1.0"
description = "Keeps a Media library stocked with New uploads from the owner's YouTube Subscriptions"
authors = [
    { name = "Florian Weßel", email = "florianwessel@gmx.net" }
]
license = "GPL-2.0-only"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "tzdata>=2026.5",
    "yt-dlp[default]>=2026.8.19",
]

[project.scripts]
youtube-helper = "youtube_helper.cli:main"

[build-system]
requires = ["uv_build>=0.9.22,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "PT", "PTH"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["yt_dlp", "yt_dlp.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Smoke tests reach the real YouTube; run them explicitly with `pytest -m smoke`.
addopts = ["--strict-markers", "-m", "not smoke"]
markers = ["smoke: downloads from the real YouTube (opt-in)"]
