{% if avatar_url %}
<img class="avatar" src="{{ avatar_url }}" alt="" loading="lazy" referrerpolicy="no-referrer">
{% else %}
<span class="avatar placeholder" aria-hidden="true">{{ name[:1] | upper }}</span>
{% endif %}
